name: Toolkit checks
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[dev]"
      - run: python -m pytest -q
      - run: python -m ruff check .
      - run: python -m build
      - run: python tools/build_release.py
      - run: python -S dist/okto.pyz solve examples/graph.json --json
      - run: python tools/smoke_release.py
  browser:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install ".[dev,web]"
      - run: python -m playwright install chromium
      - run: python -m pytest tests/test_browser.py -q
        env:
          OKTO_BROWSER_TESTS: '1'
