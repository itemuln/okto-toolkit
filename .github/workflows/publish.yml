name: Publish to PyPI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install ".[dev]" twine
      - name: Check tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python -c "import os, okto; assert os.environ['RELEASE_TAG'] == 'v' + okto.__version__"
      - run: python -m pytest -q
      - run: python -m ruff check .
      - run: python -m build
      - run: python -m twine check dist/*.whl dist/*.tar.gz
      - run: python tools/build_release.py
      - run: python tools/smoke_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: pypi-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/okto-toolkit/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pypi-distributions
          path: dist
      - name: Publish using the configured PyPI trusted publisher
        uses: pypa/gh-action-pypi-publish@release/v1
