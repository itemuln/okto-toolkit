[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "okto-toolkit"
version = "1.0.0"
description = "Offline competition analysis toolkit with evidence-ranked findings"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "OKTO event toolkit"}]
dependencies = []

[project.optional-dependencies]
audio = ["numpy>=2", "soundfile>=0.13"]
web = ["playwright>=1.49"]
dev = ["build>=1.2", "pytest>=8", "ruff>=0.11"]

[project.scripts]
okto = "okto.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
